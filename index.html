<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8f4"><title>ToDoTree | Grow your goals</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#213a2b;background:#f5f8f4}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:#eaf2e9;border-bottom:1px solid #dce6dc;padding:19px max(24px,calc((100vw - 1080px)/2));display:flex;align-items:center;gap:12px}header .logo{background:#32684b;color:white;border-radius:13px;padding:10px;font-size:24px}header b{font-size:22px}header small{display:block;color:#718676;font-size:11px}main{max-width:1080px;margin:36px auto;padding:0 24px}h1{font-size:32px;margin:0 0 6px}p{color:#728476;margin:0 0 25px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.stat,.panel,.task{background:white;border:1px solid #dce6dc;border-radius:15px}.stat{padding:19px}.stat span{display:block;color:#718476;font-size:13px}.stat strong{display:block;font-size:29px;margin-top:6px}.track{height:8px;border-radius:8px;background:#e5eee7;margin-top:8px;overflow:hidden}.fill{height:100%;background:#4d9169;transition:width .2s}.panel{padding:23px;margin-bottom:22px}h2{font-size:17px;margin:0 0 15px}.form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px}input,select{width:100%;padding:12px;border:1px solid #d7e3d9;border-radius:9px;background:white;color:#213a2b;min-width:0}button.primary{background:#32684b;color:white;border:0;border-radius:9px;padding:12px 18px;font-weight:650}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:15px}.toolbar input{max-width:350px}.filters{display:flex;gap:6px}.filters button{background:#eaf2e9;border:0;border-radius:8px;padding:10px 12px;color:#45634f}.filters button.selected{background:#32684b;color:white}.task{padding:15px;margin-bottom:9px}.taskline{display:flex;align-items:center;gap:12px}.taskline input[type=checkbox]{width:18px;height:18px;accent-color:#32684b;flex-shrink:0}.tasktext{flex:1;min-width:0}.tasktext strong{display:block;overflow-wrap:anywhere}.tasktext small{color:#829186}.task button{border:0;background:#f0f5f0;border-radius:7px;padding:7px 9px;color:#496d55}.task button:hover{background:#dceadd}.children{border-left:2px solid #dceadd;margin-left:22px;padding-left:15px;margin-top:12px}.completed{text-decoration:line-through;color:#91a093}.empty{text-align:center;color:#829186;padding:35px}footer{text-align:center;font-size:12px;color:#8a9a8e;padding:20px}dialog{border:1px solid #dce6dc;border-radius:16px;box-shadow:0 25px 90px #1a352e40;width:min(420px,calc(100vw - 30px));padding:25px}dialog::backdrop{background:#152a20a3}dialog label{display:block;font-size:12px;margin:13px 0 6px}dialog menu{display:flex;gap:8px;justify-content:flex-end;padding:0;margin:20px 0 0}dialog menu button{border:1px solid #dce6dc;border-radius:9px;background:white;padding:10px 16px}#toast{color:#32684b;min-height:22px;font-size:13px;margin-top:8px}@media(max-width:760px){.form{grid-template-columns:1fr 1fr}.form input:first-child{grid-column:span 2}.toolbar{flex-wrap:wrap}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:24px}h1{font-size:26px}}@media(max-width:440px){.form{grid-template-columns:1fr}.form input:first-child{grid-column:span 1}.filters button{padding:8px}}
</style></head><body><header><div class="logo">♣</div><div><b>ToDoTree</b><small>GROW YOUR GOALS</small></div></header><main><h1>Your task garden 🌿</h1><p>Big goals become achievable when you break them into small steps.</p><section class="stats"><div class="stat"><span>Total tasks</span><strong id="total">0</strong></div><div class="stat"><span>Completed</span><strong id="completed">0</strong></div><div class="stat"><span>Progress</span><strong id="percent">0%</strong><div class="track"><div id="fill" class="fill"></div></div></div></section><section class="panel"><h2>Create a new task</h2><form id="create" class="form"><input id="name" placeholder="What do you need to accomplish?" required maxlength="180" aria-label="Task name"><select id="priority" aria-label="Priority"><option>Medium</option><option>High</option><option>Low</option></select><select id="parent" aria-label="Parent task"><option value="">Top-level task</option></select><button class="primary" type="submit">+ Create</button></form><div id="toast" role="status"></div></section><section class="panel"><div class="toolbar"><h2 style="margin:0">Your tasks</h2><input id="search" placeholder="Search tasks..." aria-label="Search tasks"><div class="filters"><button data-filter="all" class="selected">All</button><button data-filter="active">Active</button><button data-filter="done">Done</button></div></div><div id="list"></div></section></main><footer>ToDoTree · Make room for what matters · Tasks saved in this browser</footer><dialog id="editDialog"><form id="editForm"><h2>Edit task</h2><label for="editName">Task name</label><input id="editName" required maxlength="180"><label for="editPriority">Priority</label><select id="editPriority"><option>Low</option><option>Medium</option><option>High</option></select><menu><button type="button" id="cancelEdit">Cancel</button><button type="submit" class="primary">Save changes</button></menu></form></dialog><script>
(()=>{'use strict';const KEY='todotree-v1',by=id=>document.getElementById(id);let tasks=[];try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved))tasks=saved}catch{}let filter='all',query='',editing=null;const uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random();const children=id=>tasks.filter(t=>t.parent===id);function descendants(id){return children(id).flatMap(t=>[t.id,...descendants(t.id)])}function persist(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch{by('toast').textContent='Browser storage unavailable. Tasks may not survive a refresh.'}}function node(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}function button(label,title,fn){const b=node('button','',label);b.type='button';b.title=title;b.setAttribute('aria-label',title);b.addEventListener('click',fn);return b}function taskNode(t,level=0){const wrap=node('div','task');const line=node('div','taskline');const cb=node('input');cb.type='checkbox';cb.checked=!!t.done;cb.setAttribute('aria-label','Complete '+t.name);cb.addEventListener('change',()=>{const ids=new Set([t.id,...descendants(t.id)]);tasks=tasks.map(x=>ids.has(x.id)?{...x,done:cb.checked}:x);persist();render()});line.append(cb);const info=node('div','tasktext');info.append(node('strong',t.done?'completed':'',t.name));info.append(node('small','',t.priority+' priority'));line.append(info);line.append(button('＋','Add subtask',()=>{by('parent').value=t.id;by('name').focus();by('toast').textContent='Adding a subtask to '+t.name}));line.append(button('✎','Edit task',()=>{editing=t.id;by('editName').value=t.name;by('editPriority').value=t.priority;by('editDialog').showModal()}));line.append(button('×','Delete task',()=>{if(!confirm('Delete this task and its subtasks?'))return;const ids=new Set([t.id,...descendants(t.id)]);tasks=tasks.filter(x=>!ids.has(x.id));persist();render()}));wrap.append(line);const kids=children(t.id).filter(matchesBranch);if(kids.length&&level<30){const childWrap=node('div','children');kids.forEach(c=>childWrap.append(taskNode(c,level+1)));wrap.append(childWrap)}return wrap}function matches(t){return(!query||t.name.toLowerCase().includes(query))&&(filter==='all'||(filter==='done'?t.done:!t.done))}function matchesBranch(t){return matches(t)||descendants(t.id).some(id=>{const x=tasks.find(v=>v.id===id);return x&&matches(x)})}function render(){by('total').textContent=tasks.length;const done=tasks.filter(t=>t.done).length;by('completed').textContent=done;const p=tasks.length?Math.round(done/tasks.length*100):0;by('percent').textContent=p+'%';by('fill').style.width=p+'%';const parent=by('parent'),selected=parent.value;parent.replaceChildren(new Option('Top-level task',''));tasks.forEach(t=>parent.add(new Option(t.name,t.id)));parent.value=tasks.some(t=>t.id===selected)?selected:'';const list=by('list');list.replaceChildren();const roots=tasks.filter(t=>!t.parent||!tasks.some(x=>x.id===t.parent)).filter(matchesBranch);if(!roots.length)list.append(node('div','empty','🌱 No matching tasks yet. Create one above!'));roots.forEach(t=>list.append(taskNode(t)))}by('create').addEventListener('submit',e=>{e.preventDefault();const name=by('name').value.trim();if(!name)return;tasks.push({id:uid(),parent:by('parent').value||null,name,priority:by('priority').value,done:false});persist();by('name').value='';by('parent').value='';filter='all';query='';by('search').value='';document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('selected',b.dataset.filter==='all'));by('toast').textContent='✓ Task created';render()});by('search').addEventListener('input',e=>{query=e.target.value.toLowerCase();render()});document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('selected',x===b));render()}));by('cancelEdit').addEventListener('click',()=>by('editDialog').close());by('editForm').addEventListener('submit',e=>{e.preventDefault();const name=by('editName').value.trim();if(!name)return;tasks=tasks.map(t=>t.id===editing?{...t,name,priority:by('editPriority').value}:t);persist();by('editDialog').close();render()});render()})();
</script></body></html>
